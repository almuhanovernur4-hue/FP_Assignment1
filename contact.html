<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Artist Stream Counter - Contacts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Artist stream counter</h1>
    <nav>
        <a href="index.html">Main</a>
        <a href="about.html">About Us</a>
        <a href="contact.html" class="active">Contacts</a>
    </nav>
</header>

<main>
    <h1>Contact us</h1>
    <p>Kindly fill in the form below to get in touch with us if you have any new artist suggestions.</p>

    <form>
        <div>
            <label for="title-mr">Title:</label><br>
            <input type="radio" id="title-mr" name="title" value="mr" required>
            <label for="title-mr">Mr</label>
            <input type="radio" id="title-ms" name="title" value="ms">
            <label for="title-ms">Ms</label>
            <input type="radio" id="title-dr" name="title" value="dr">
            <label for="title-dr">Dr</label>
        </div>
        <br>

        <div>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" minlength="5" maxlength="10" required>
        </div>
        <br>

        <div>
            <label for="email">Email address:</label><br>
            <input type="email" id="email" name="email" placeholder="akkre@email.com" required>
        </div>
        <br>

        <div>
            <label for="number">Phone Number:</label><br>
            <input type="tel" id="number" name="number" placeholder="012-3456-7890" pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}" required>
        </div>
        <br>

        <div>
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" required>
        </div>
        <br>

        <div>
            <label for="comment">Type in your Comments:</label><br>
            <textarea id="comment" name="comment" cols="30" rows="10" required></textarea>
        </div>
        <br>

        <div>
            <input type="checkbox" id="subscribe" name="subscribe">
            <label for="subscribe">Subscribe to my Newsletters</label>
        </div>
        <br>

        <div>
            <button type="submit">Reach me</button>
            <input type="reset" value="Reset">
        </div>
    </form>
</main>

<footer>
    <p>&copy; 2026 Artist Stream Counter</p>
</footer>

</body>
</html>
